<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>核醫腳本工坊</title>
    <meta
      name="description"
      content="以病人主視角整理 FDG PET/CT、PSMA PET、Ra-223、I-131 治療四支核醫衛教影片的分場腳本與鏡頭分鏡，供醫療團隊與製作人員內部審稿。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../ai-village/styles.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="motion-field" aria-hidden="true">
      <span class="chalk-orbit orbit-one"></span>
      <span class="chalk-orbit orbit-two"></span>
      <span class="chalk-line line-one"></span>
      <span class="chalk-line line-two"></span>
    </div>
    <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="開啟選單">
      <span></span><span></span><span></span>
    </button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="layout-shell">
      <aside class="sidebar" id="sidebar">
        <header class="brand-block">
          <div class="brand-mark">NM</div>
          <div>
            <h1>核醫腳本工坊</h1>
            <p>把每一支片真正要處理的情緒和資訊，先在這裡寫清楚。</p>
          </div>
        </header>

        <div class="side-focus">
          <p>這裡集中放腳本、分鏡、情緒節點與醫療核對項目，方便內部修稿時逐段比對。</p>
        </div>

        <nav class="course-nav" aria-label="腳本單元">
          <button class="nav-link active" data-page="overview"><span>01</span>工作區總覽</button>
          <button class="nav-link" data-page="fdg"><span>02</span>FDG PET/CT</button>
          <button class="nav-link" data-page="psma"><span>03</span>PSMA PET</button>
          <button class="nav-link" data-page="ra223"><span>04</span>Ra-223</button>
          <button class="nav-link" data-page="i131"><span>05</span>I-131 治療</button>
        </nav>

        <footer class="side-note">
          <p>每一個鏡頭和句子，最後都還是要回到院內流程、醫囑與法規版本做終稿確認。</p>
            <p><a href="../">返回 Dr. Huang's 核醫工具箱</a></p>
            <p class="side-credit">Personal script workspace for nuclear medicine videos</p>
        </footer>
      </aside>

      <main class="reader">
        <div id="content-display" class="reader-inner"></div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
