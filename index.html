<!DOCTYPE html>

    <title>Dr. Huang's 核醫工具箱</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
</head>
<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="開啟選單">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
    </button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <div class="brand-icon" aria-hidden="true">
                        <img src="assets/logo/dr-huang-toolbox-logo.svg" alt="">

                    <div>
                        <h1>Dr. Huang's</h1>
                        <p class="brand-subtitle">核醫工具箱</p>
                    </div>
                </div>
                <div class="search-box">

                </div>
            </div>

                <div class="sidebar-priority">
                    <span class="sidebar-priority-label">快速入口</span>
                    <button class="nav-item nav-item-priority active" data-category="HomeHub">首頁總覽</button>
                </div>

                <!-- 📚 核醫小學堂 -->
                <div class="nav-group">
                    <button class="nav-group-toggle" data-group="learning">
                        <span class="nav-group-icon">📚</span>
                        <span class="nav-group-label">核醫小學堂</span>
                        <span class="nav-group-count">6</span>
                        <svg class="nav-group-arrow" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>

                    <div class="nav-group-items" id="group-learning">
                        <button class="nav-item active" data-category="NMBasics">核醫原理、儀器與技術</button>
                        <button class="nav-item" data-category="DocumentControl">文件與品質管理</button>

                        <button class="nav-item" data-category="DosageTable">藥物與劑量工具</button>
                    </div>
                </div>

                <div class="nav-group">
                    <button class="nav-group-toggle" data-group="therapy">
                        <span class="nav-group-icon">💊</span>
                        <span class="nav-group-label">核醫治療</span>

                        <svg class="nav-group-arrow" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                    </button>
                    <div class="nav-group-items" id="group-therapy">
                        <button class="nav-item" data-category="I131">I-131 甲狀腺治療</button>
                        <button class="nav-item" data-category="Ra223">Ra-223 骨轉移治療</button>
                        <button class="nav-item" data-category="Lu177PSMA">Lu-177 PSMA 治療</button>
                        <button class="nav-item" data-category="Lu177DOTATATE">Lu-177 PRRT 治療</button>
                        <button class="nav-item" data-category="OtherTherapies">其他治療</button>
                    </div>
                </div>

                        <button class="nav-item" data-category="CardiacPET">心臟正子掃描</button>

                </div>

                <div class="nav-group">
                    <button class="nav-group-toggle" data-group="endocrine">

                        <button class="nav-item" data-category="Salivary">唾液腺掃描</button>
                    </div>
                </div>

                    <button class="nav-group-toggle" data-group="cardiac">
                        <span class="nav-group-icon">❤️</span>

                    </div>
                </div>

                    <button class="nav-group-toggle" data-group="gi">
                        <span class="nav-group-icon">🫁</span>
                        <span class="nav-group-label">消化 / 肝膽</span>
                        <span class="nav-group-count">7</span>
